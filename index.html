<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VietJet Air Download</title>
  <link rel="stylesheet" href="../styles.css">
</head>

<body>
  <div class="card">

    <div class="logo-wrap">
      <img src="assets/vietjet.png" alt="VietJet Air logo">
    </div>

    <h1>VietJet Air</h1>

    <p>Choose your device to download the official app.</p>

    <a class="button"
       href="https://apps.apple.com/us/app/vietjet-air/id1258124955"
       target="_blank" rel="noopener">
      Download on the App Store
    </a>

    <a class="button secondary"
       href="https://play.google.com/store/apps/details?id=com.vietjetair.android"
       target="_blank" rel="noopener">
      Get it on Google Play
    </a>

    <div class="small">
      Scan the QR code, choose your device, and download the official VietJet Air app.
    </div>

  </div>
</body>
</html>
